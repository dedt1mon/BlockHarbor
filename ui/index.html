<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlockHarbor</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/experience.css" />
    <link rel="stylesheet" href="/build-care.css" />
    <link rel="stylesheet" href="/updates.css" />
    <link rel="stylesheet" href="/pack-hub.css" />
    <link rel="stylesheet" href="/catalog-ux.css" />
    <link rel="stylesheet" href="/download-progress.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <img src="/icon.svg" width="40" height="40" alt="" />
        <div>BlockHarbor</div>
      </div>
      <nav aria-label="Навигация">
        <button data-view="home" class="nav sel">
          <i data-icon="home"></i><span>Главная</span></button
        ><button data-view="builds" class="nav">
          <i data-icon="layers"></i><span>Сборки</span></button
        ><button data-view="friends" class="nav">
          <i data-icon="users"></i><span>Друзья</span></button
        ><button data-view="profile" class="nav">
          <i data-icon="user"></i><span>Профиль</span>
        </button>
        <button data-view="gallery" class="nav"><i data-icon="image"></i><span>Скриншоты</span></button>
      </nav>
      <div class="aside-bottom">
        <button class="nav" data-view="settings">
          <i data-icon="settings"></i><span>Настройки</span>
        </button>
        <div class="appversion"><b></b> BlockHarbor <span>2.6.15</span></div>
      </div>
    </aside>
    <main>
      <header>
        <div class="crumb">
          <span>Лаунчер</span><span class="slash">/</span
          ><strong id="crumb">Главная</strong>
        </div>
        <div class="header-actions"><button class="icon-button batch-toggle" data-batch-open aria-label="Установка дополнений" title="Установка дополнений" hidden><i data-icon="download"></i></button><button class="icon-button notification-bell" data-experience="notifications" aria-label="История уведомлений" title="История уведомлений"><i data-icon="bell"></i><span class="notification-dot" aria-hidden="true" hidden></span></button>
        <button id="accountChip" class="account-chip" data-view="profile">
          <i data-icon="user"></i><span id="topUser">Мой профиль</span>
        </button>
        </div>
      </header>
      <div id="gameExit" hidden>
        <span id="gameExitMessage" role="status" aria-live="polite"></span><button class="btn" data-experience="showBuildErrors">Ошибки сборки</button>
        <button
          class="icon-button"
          data-act="dismissExit"
          aria-label="Скрыть сообщение о завершении игры"
        >
          <i data-icon="close"></i>
        </button>
      </div>
      <section id="view" aria-label="Содержимое"></section>
    </main>
    <div
      id="notice"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      hidden
    ></div>
    <section id="downloadProgress" popover="manual" aria-label="Текущая загрузка" hidden>
      <div class="download-progress-heading"><i data-icon="download"></i><strong data-download-title></strong></div>
      <p class="download-progress-message" data-download-message role="status" aria-live="polite"></p>
      <progress max="1" aria-label="Загрузка файлов"></progress>
      <p class="download-progress-metric" data-download-metric hidden></p>
      <p class="download-progress-summary" data-download-summary hidden></p>
      <div class="download-progress-actions"><button type="button" class="btn" data-download-details>Открыть загрузки</button><button type="button" class="btn" data-download-cancel>Отменить загрузку</button></div>
    </section>
    <dialog id="dialog" aria-labelledby="dialogTitle">
      <div class="dialog-top">
        <h2 id="dialogTitle"></h2>
        <div id="dialogHeaderActions" class="dialog-header-actions" hidden></div>
        <button class="icon-button" aria-label="Закрыть" id="dialogClose">
          <i data-icon="close"></i>
        </button>
      </div>
      <div id="dialogBody"></div>
    </dialog>
    <input type="file" id="filePick" multiple hidden /><input
      type="file"
      id="skinPick"
      accept="image/png"
      hidden
    />
    <input type="file" id="buildZipPick" accept=".zip,application/zip" hidden />
    <script src="/island.js"></script>
    <script src="/window.js"></script>
    <script src="/catalog-filters.js"></script>
    <script src="/compatibility.js"></script>
    <script src="/catalog.js"></script>
    <script src="/batch-install.js"></script>
    <script src="/app.js"></script>
    <script src="/download-progress.js"></script>
    <script src="/experience.js"></script>
    <script src="/build-care.js"></script>
    <script src="/updates.js"></script>
    <script src="/pack-hub.js"></script>
  </body>
</html>
