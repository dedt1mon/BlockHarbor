name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths:
      - launcher/version.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blockharbor-stable-release
  cancel-in-progress: true

jobs:
  tests:
    if: github.repository == 'dedt1mon/BlockHarbor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full Python suite
        run: python -m unittest discover -s tests -q
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          for file in ui/*.js; do node --check "$file"; done

  release:
    needs: tests
    if: github.repository == 'dedt1mon/BlockHarbor' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false

      - name: Determine stable version
        shell: pwsh
        run: |
          $version = (python -c "from launcher.version import VERSION; print(VERSION)").Trim()
          if ($version -notmatch '^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$') { throw "Invalid stable version: $version" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build portable Windows x64 launcher
        shell: pwsh
        run: |
          python tools/build_windows.py --output "$env:RUNNER_TEMP\blockharbor-portable"
          if ($LASTEXITCODE -ne 0) { throw "Portable Windows build failed" }

      - name: Download and verify official NSIS 3.13 compiler
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "nsis-3.13.zip"
          $expected = "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8"
          $urls = @(
            "https://github.com/egoist/mygo/releases/download/nsis-3.13/nsis-3.13.zip",
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip",
            "https://sourceforge.net/projects/nsis/files/NSIS%203/3.13/nsis-3.13.zip/download"
          )
          $verified = $false
          foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 3 -and -not $verified; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 10 -TimeoutSec 90
                $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actual -ne $expected) { throw "NSIS ZIP failed the official SHA-256 check" }
                $verified = $true
              } catch {
                Write-Warning "NSIS download attempt $attempt failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (3 * $attempt)
              }
            }
            if ($verified) { break }
          }
          if (-not $verified) { throw "Could not download verified NSIS 3.13 from official mirrors" }
          $directory = Join-Path $env:RUNNER_TEMP "nsis-3.13"
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $compiler = Get-ChildItem -Path $directory -Filter "makensis.exe" -Recurse -File | Select-Object -First 1
          if (-not $compiler) { throw "Official NSIS archive does not include makensis.exe" }
          & $compiler.FullName /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler cannot start" }
          "NSIS_COMPILER=$($compiler.FullName)" >> $env:GITHUB_ENV
          "NSIS_HOME=$($compiler.DirectoryName)" >> $env:GITHUB_ENV

      - name: Build installer and verified update manifest
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP "blockharbor-release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $portable = Join-Path $env:RUNNER_TEMP "blockharbor-portable\BlockHarbor.exe"
          $setup = Join-Path $release "BlockHarbor-Setup-$env:RELEASE_VERSION.exe"
          if (-not (Test-Path $env:NSIS_COMPILER)) { throw "Verified NSIS compiler not found" }
          python tools/build_installer.py --launcher $portable --output $setup --version $env:RELEASE_VERSION --makensis $env:NSIS_COMPILER --nsisdir $env:NSIS_HOME --go go --project-url "https://github.com/dedt1mon/BlockHarbor"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed" }
          Copy-Item $portable (Join-Path $release "BlockHarbor.exe")
          python tools/release_update_manifest.py --version $env:RELEASE_VERSION --installer $setup --output (Join-Path $release "BlockHarbor-update.json")
          if ($LASTEXITCODE -ne 0) { throw "Update manifest generation failed" }
          $meta = Get-Content (Join-Path $release "BlockHarbor-update.json") -Raw | ConvertFrom-Json
          if ($meta.version -ne $env:RELEASE_VERSION -or $meta.installer.size -ne (Get-Item $setup).Length -or $meta.installer.sha256 -ne (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()) { throw "Release metadata does not match installer" }
          $names = @("BlockHarbor-Setup-$env:RELEASE_VERSION.exe", "BlockHarbor.exe", "BlockHarbor-update.json")
          $sums = foreach ($name in $names) {
            $hash = (Get-FileHash (Join-Path $release $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [System.IO.File]::WriteAllLines((Join-Path $release "SHA256SUMS.txt"), $sums, [System.Text.UTF8Encoding]::new($false))

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Join-Path $env:RUNNER_TEMP "blockharbor-release"
          $name = "BlockHarbor-Setup-$env:RELEASE_VERSION.exe"
          $files = @(
            (Join-Path $release $name),
            (Join-Path $release "BlockHarbor.exe"),
            (Join-Path $release "BlockHarbor-update.json"),
            (Join-Path $release "SHA256SUMS.txt")
          )
          $notes = "docs/releases/v$env:RELEASE_VERSION.md"
          if (!(Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release create "v$env:RELEASE_VERSION" $files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "BlockHarbor $env:RELEASE_VERSION — каталог и публикации" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
