name: Diagnose BlockHarbor catalog origin

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-origin-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public catalog with no credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          targets = [
              "https://blockharbor-community-catalog.ded8timon.chatgpt.site/v1/builds",
              "https://github.com/dedt1mon/BlockHarbor/releases/latest",
          ]
          for url in targets:
              print("URL", url, flush=True)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "BlockHarbor/2.6.3", "Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      print("OK", response.status, "type", response.headers.get("Content-Type"), "sample", response.read(400).decode("utf-8", "replace"), flush=True)
              except Exception as exc:
                  print("FAILED", type(exc).__name__, str(exc), flush=True)
          PY
