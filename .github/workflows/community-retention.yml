name: Verify 1-hour community retention and compatibility

on:
  push:
    branches: [main, feature/community-retention-1h]
    paths:
      - 'community-registry/**'
      - 'main.py'
      - 'launcher/community_catalog.py'
      - 'ui/pack-hub.css'
      - 'launcher/community_catalog.py'
      - 'tools/sync_community_mirror.py'
      - 'ui/pack-hub.js'
      - 'tests/test_community*.py'
      - '.github/workflows/community-retention.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Worker expiry, archive integrity and concurrency tests
        run: node --test community-registry/worker.test.mjs
      - name: Community retention, mirror index and secure imports
        run: python -m unittest tests.test_community_catalog tests.test_community_abuse_client tests.test_community_mirror tests.test_community_mirror_sync tests.test_shared_builds -q
      - name: Browser and mirror tool syntax
        run: |
          node --check ui/pack-hub.js
          node --check community-registry/worker.mjs
          python -m py_compile tools/sync_community_mirror.py launcher/community_catalog.py
