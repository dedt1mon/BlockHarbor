name: Community catalog contract tests

on:
  push:
    branches: [main]
    paths:
      - 'community-registry/**'
      - 'launcher/community_catalog.py'
      - 'launcher/community_auto.py'
      - 'tests/test_community_catalog.py'
      - 'tests/test_community_auto.py'
      - '.github/workflows/community-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Server update contract
        run: node --test community-registry/worker.test.mjs
      - name: Client publication contract
        run: python -m unittest discover -s tests -p 'test_community*.py' -q
