name: Build and publish Windows release

on:
  push:
    branches: [main, 'preview/**']
    paths:
      - launcher/version.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blockharbor-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.repository == 'dedt1mon/BlockHarbor' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/preview/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt playwright==1.62.0
      - name: Verify Python behavior and shipped static assets
        run: python -m unittest discover -s tests -q
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          for file in ui/*.js; do node --check "$file"; done
      - name: Window lifecycle, catalog retention and shared skins
        run: |
          node tests/window-lifecycle.cjs
          node --test tests/ui-pack-install.cjs
          node --test tests/ui-download-progress.cjs tests/ui-community-recovery.cjs
          node --test community-registry/worker.test.mjs community-registry/skin-registry.test.mjs
      - name: Verify shared UI geometry in Chromium
        run: python tools/smoke_ui_layout.py
      - name: Check download progress, pagination and notification history
        run: python -u tools/smoke_ui_refinements.py --output artifacts/ui-refinements
      - name: Save focused UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-refinements
          path: artifacts/ui-refinements
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: tests
    if: github.repository == 'dedt1mon/BlockHarbor' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/preview/'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false

      - name: Determine release version
        shell: pwsh
        run: |
          $version = (python -c "from launcher.version import VERSION; print(VERSION)").Trim()
          if ($version -notmatch '^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$') { throw "Invalid stable version: $version" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build portable Windows x64 launcher
        shell: pwsh
        run: |
          python tools/build_windows.py --output "$env:RUNNER_TEMP\blockharbor-portable"
          if ($LASTEXITCODE -ne 0) { throw "Portable Windows build failed" }

      - name: Install NSIS with AMD64 stubs from MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: mingw-w64-clang-x86_64-nsis

      - name: Verify NSIS compiler and x64 installation stubs
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $compiler = Join-Path $env:MSYS2_LOCATION "clang64\bin\makensis.exe"
          $nsisRoot = Join-Path $env:MSYS2_LOCATION "clang64\share\nsis"
          if (!(Test-Path $compiler)) { throw "NSIS compiler not found" }
          foreach ($required in @("Stubs\zlib-amd64-unicode", "Plugins\amd64-unicode\nsDialogs.dll")) {
            if (!(Test-Path (Join-Path $nsisRoot $required))) { throw "Missing NSIS x64 dependency: $required" }
          }
          & $compiler /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler cannot start" }
          "NSIS_COMPILER=$compiler" >> $env:GITHUB_ENV
          "NSIS_HOME=$nsisRoot" >> $env:GITHUB_ENV

      - name: Build installer and verified update manifest
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP "blockharbor-release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $portable = Join-Path $env:RUNNER_TEMP "blockharbor-portable\BlockHarbor.exe"
          $setup = Join-Path $release "BlockHarbor-Setup-$env:RELEASE_VERSION.exe"
          if (-not (Test-Path $env:NSIS_COMPILER)) { throw "Verified NSIS compiler not found" }
          python tools/build_installer.py --launcher $portable --output $setup --version $env:RELEASE_VERSION --makensis $env:NSIS_COMPILER --nsisdir $env:NSIS_HOME --go go --project-url "https://github.com/dedt1mon/BlockHarbor"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed" }
          Copy-Item $portable (Join-Path $release "BlockHarbor.exe")
          python tools/release_update_manifest.py --version $env:RELEASE_VERSION --installer $setup --output (Join-Path $release "BlockHarbor-update.json")
          if ($LASTEXITCODE -ne 0) { throw "Update manifest generation failed" }
          $meta = Get-Content (Join-Path $release "BlockHarbor-update.json") -Raw | ConvertFrom-Json
          if ($meta.version -ne $env:RELEASE_VERSION -or $meta.installer.size -ne (Get-Item $setup).Length -or $meta.installer.sha256 -ne (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()) { throw "Release metadata does not match installer" }
          $names = @("BlockHarbor-Setup-$env:RELEASE_VERSION.exe", "BlockHarbor.exe", "BlockHarbor-update.json")
          $sums = foreach ($name in $names) {
            $hash = (Get-FileHash (Join-Path $release $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [System.IO.File]::WriteAllLines((Join-Path $release "SHA256SUMS.txt"), $sums, [System.Text.UTF8Encoding]::new($false))

      - name: Verify compiled Russian metadata and actual Windows setup
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP "blockharbor-release"
          $setup = Join-Path $release "BlockHarbor-Setup-$env:RELEASE_VERSION.exe"
          $portable = Join-Path $release "BlockHarbor.exe"
          $description = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($setup).FileDescription
          if ($description -cne "Установщик BlockHarbor") { throw "Installer Russian version resource mismatch: $description" }
          Write-Host "PASS: compiled Cyrillic FileDescription"
          python tools/smoke_windows_release.py --setup $setup --portable $portable --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Windows install and packaged runtime smoke test failed" }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Join-Path $env:RUNNER_TEMP "blockharbor-release"
          $name = "BlockHarbor-Setup-$env:RELEASE_VERSION.exe"
          $files = @(
            (Join-Path $release $name),
            (Join-Path $release "BlockHarbor.exe"),
            (Join-Path $release "BlockHarbor-update.json"),
            (Join-Path $release "SHA256SUMS.txt")
          )
          $notes = "docs/releases/v$env:RELEASE_VERSION.md"
          if (!(Test-Path $notes)) { throw "Missing release notes: $notes" }
          $releaseFlags = @("--latest")
          $releaseTitle = "BlockHarbor $env:RELEASE_VERSION"
          if ($env:GITHUB_REF.StartsWith("refs/heads/preview/")) {
            $releaseFlags = @("--prerelease", "--latest=false")
            $releaseTitle += " — предварительный выпуск"
          }
          gh release create "v$env:RELEASE_VERSION" $files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title $releaseTitle --notes-file $notes @releaseFlags
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
